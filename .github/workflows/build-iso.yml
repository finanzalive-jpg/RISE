name: Build ISO

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.3)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Pick version
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          elif [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}";
          else V="0.5-dev.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        run: sudo --preserve-env=GITHUB_TOKEN WORK=/mnt/rise-work ./build/build-iso.sh "${{ steps.v.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.iso out/*.sha256 \
            --title "Rise ${{ steps.v.outputs.version }}" \
            --notes-file docs/release-notes.md

      - name: Publish preview build (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview out/*.iso out/*.sha256 out/*.packages.txt --prerelease \
            --title "Rise preview (${{ steps.v.outputs.version }})" \
            --notes "Automatic build of the latest code on main. For testing: it may contain bugs."
