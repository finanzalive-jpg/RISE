set default=0
set timeout=5
set timeout_style=menu
insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
loadfont unicode
terminal_output gfxterm
set gfxpayload=keep
set theme=/boot/grub/themes/rise/theme.txt
# sfondo anche per la finestra di testo di GRUB: mentre carica il sistema non compare nessun riquadro nero
background_image /boot/grub/themes/rise/bg.png
set color_normal=white/black
set color_highlight=black/light-cyan

menuentry "Avvia Rise" {
    # si resta in grafica (così poi compare il logo di Rise) ma senza tema: la finestra di testo occupa
    # tutto lo schermo con lo sfondo blu e non resta un riquadro scuro sopra il menu (BIOS e UEFI)
    set theme=; terminal_output console; terminal_output gfxterm; background_image /boot/grub/themes/rise/bg.png
    clear
    linux /casper/vmlinuz boot=casper noprompt username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 ---
    initrd /casper/initrd
}

menuentry "Grafica di sicurezza (se lo schermo resta nero)" {
    # si resta in grafica (così poi compare il logo di Rise) ma senza tema: la finestra di testo occupa
    # tutto lo schermo con lo sfondo blu e non resta un riquadro scuro sopra il menu (BIOS e UEFI)
    set theme=; terminal_output console; terminal_output gfxterm; background_image /boot/grub/themes/rise/bg.png
    clear
    linux /casper/vmlinuz boot=casper noprompt username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it nomodeset quiet ---
    initrd /casper/initrd
}

menuentry "Avvia tutto in memoria (poi togli la chiavetta)" {
    # si resta in grafica (così poi compare il logo di Rise) ma senza tema: la finestra di testo occupa
    # tutto lo schermo con lo sfondo blu e non resta un riquadro scuro sopra il menu (BIOS e UEFI)
    set theme=; terminal_output console; terminal_output gfxterm; background_image /boot/grub/themes/rise/bg.png
    clear
    linux /casper/vmlinuz boot=casper noprompt toram username=rise hostname=rise locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 ---
    initrd /casper/initrd
}

menuentry "Spegni" {
    halt
}
